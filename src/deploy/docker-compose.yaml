services:
  p6-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: strato
      POSTGRES_PASSWORD: strato
      POSTGRES_DB: strato
    volumes:
      - ./p6_pgdata:/var/lib/postgresql/data
    networks:
      - appnet

  backend:
    image: ghcr.io/YOUR_GH_USER/backend:latest
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    depends_on:
      - p6-postgres
    networks:
      - appnet

  frontend:
    image: ghcr.io/YOUR_GH_USER/frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - appnet

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - appnet

networks:
  appnet:
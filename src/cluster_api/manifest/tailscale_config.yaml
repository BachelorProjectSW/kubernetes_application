apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-api-tailscale-config

data:
  # Expose the app through Tailscale Serve on port 8040 using HTTP.
  # Incoming requests to the Tailscale device name/IP on port 8040
  # are proxied to the app listening on localhost:8040 inside the Pod.
  #
  # TS_CERT_DOMAIN is the Tailscale DNS name for this node/service,
  # provided automatically by Tailscale.
  serve.json: |
    {
      "TCP": {
        "8040": {
          "HTTP": true
        }
      },
      "Web": {
        "${TS_CERT_DOMAIN}:8040": {
          "Handlers": {
            "/": {
              "Proxy": "http://127.0.0.1:8040"
            }
          }
        }
      }
    }
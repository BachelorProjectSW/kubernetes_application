apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cluster-api

  template:
    metadata:
      labels:
        app: cluster-api

    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""

      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: cluster-api
          image: ghcr.io/bachelorprojectsw/cluster-api:latest
          imagePullPolicy: Always

        - name: tailscale
          image: tailscale/tailscale:latest
          imagePullPolicy: Always

          env:
          #Auth key to join the tailnet
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
          #Where to store identity (persist same machine, even if pod dies)
            - name: TS_STATE_DIR
              value: /var/lib/tailscale

          #Funnel config
            - name: TS_SERVE_CONFIG
              value: /config/serve.json
    
            - name: TS_HOSTNAME
              value: cluster-api

        #Where the storage is at in the container
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: tailscale-config
              mountPath: /config

    #What storage/config sources the pod have available
      volumes:
        - name: tailscale-state
          persistentVolumeClaim: #same Tailscale machine identity, instead of registering as a new device after a restart
            claimName: cluster-api-tailscale-state
        - name: tailscale-config
          configMap:
            name: cluster-api-tailscale-config
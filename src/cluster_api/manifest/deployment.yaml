apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-api

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: cluster-api

  template:
    metadata:
      labels:
        app: cluster-api

    spec:
      serviceAccountName: cluster-api-sa

      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"

      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: cluster-api
          image: ghcr.io/bachelorprojectsw/cluster-api:844126c31332f9b128c89d39bba63d39a51583a8
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          volumeMounts:
            - name: gpiochip4
              mountPath: /dev/gpiochip4
          ports:
            - containerPort: 8040
              hostPort: 8040
              protocol: TCP
      volumes:
        - name: gpiochip4
          hostPath:
            path: /dev/gpiochip4
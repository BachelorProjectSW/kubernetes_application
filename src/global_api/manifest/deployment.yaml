apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: global-api

  template:
    metadata:
      labels:
        app: global-api

    spec:

      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"

      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: global-api
          image: ghcr.io/bachelorprojectsw/global-api:53102a1ee8c744a2e043b800f44ac6f76200d05f
          imagePullPolicy: IfNotPresent
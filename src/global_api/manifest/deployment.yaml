apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: global-api

  template:
    metadata:
      labels:
        app: global-api

    spec:

      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"

      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: global-api
          image: ghcr.io/bachelorprojectsw/global-api:591e6c6de9be80ee3fdb7c9d1ab01202c8b37739
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8020
              hostPort: 8020
              protocol: TCP
              
          env:                                           
            - name: ELECTRICITY_MAPS_API_KEY              
              valueFrom:                                  
                secretKeyRef:                             
                  name: global-api-secrets                
                  key: ELECTRICITY_MAPS_API_KEY
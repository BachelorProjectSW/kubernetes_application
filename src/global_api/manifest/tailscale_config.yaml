apiVersion: v1
kind: ConfigMap
metadata:
  name: global-api-tailscale-config

data:
  # Expose the app through Tailscale Serve on port 8020 using HTTP.
  # Incoming requests to the Tailscale device name/IP on port 8020
  # are proxied to the app listening on localhost:8020 inside the Pod.
  #
  # TS_CERT_DOMAIN is the Tailscale DNS name for this node/service,
  # provided automatically by Tailscale.
  serve.json: |
    {
      "TCP": {
        "8020": {
          "HTTP": true
        }
      },
      "Web": {
        "${TS_CERT_DOMAIN}:8020": {
          "Handlers": {
            "/": {
              "Proxy": "http://127.0.0.1:8020"
            }
          }
        }
      }
    }
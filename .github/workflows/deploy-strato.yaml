name: Deploy strato

on:
  push:
    branches:
      - main
    paths:
      - 'src/strato_api/**'
      - 'src/frontend/**'
      - 'src/db/**'
      - 'src/models/**'
      - 'src/custom_logging/**'
      - 'test/**'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - '.github/workflows/deploy-strato.yml'

concurrency:
  group: deploy-strato-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          use-cache: 'true'

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=accept-new ubuntu@ci << 'EOF'
            set -e
            cd ~/kubernetes_application
            git fetch origin
            git checkout main
            git pull origin main
            docker compose up -d --build
            docker compose ps
          EOF
name: Build and deploy APIs

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'src/cluster_api/manifest/deployment.yaml'
      - 'src/global_api/manifest/deployment.yaml'

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build_cluster:
    if: ${{ github.actor != 'cluster-api-deploy-bot[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - name: Set owner name to lowercase
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cluster-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/cluster_api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cluster-api:${{ github.sha }}

  build_global:
    if: ${{ github.actor != 'cluster-api-deploy-bot[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - name: Set owner name to lowercase
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push global-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/global_api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/global-api:${{ github.sha }}

  update_manifests:
    if: ${{ github.actor != 'cluster-api-deploy-bot[bot]' }}
    needs:
      - build_cluster
      - build_global
    runs-on: ubuntu-latest

    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Update manifest image tags
        run: |
          sed -i "s|image: ghcr.io/bachelorprojectsw/cluster-api:.*|image: ghcr.io/bachelorprojectsw/cluster-api:${GITHUB_SHA}|" src/cluster_api/manifest/deployment.yaml
          sed -i "s|image: ghcr.io/bachelorprojectsw/global-api:.*|image: ghcr.io/bachelorprojectsw/global-api:${GITHUB_SHA}|" src/global_api/manifest/deployment.yaml

      - name: Commit and push manifest updates
        run: |
          git config user.name "cluster-api-deploy-bot[bot]"
          git config user.email "cluster-api-deploy-bot[bot]@users.noreply.github.com"

          git add src/cluster_api/manifest/deployment.yaml src/global_api/manifest/deployment.yaml
          git diff --cached --quiet && exit 0
          
          git commit -m "Deploy APIs ${GITHUB_SHA}"
          git push origin HEAD:main
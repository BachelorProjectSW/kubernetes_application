name: Build and push Cluster API Docker image
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'src/cluster_api/manifest/deployment.yaml'

permissions:
  contents: write 
  packages: write #Allow pushing container images to GHCR

concurrency:
  group: build-and-deploy-main
  cancel-in-progress: true
jobs:
  build_and_push:
    if: ${{ github.actor != 'cluster-api-deploy-bot[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}


      - name: Set owner name to lowercase
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      #QEMU lets us emulate another CPU architecture so we can build an image for it
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      #Builds a multi arch version
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/cluster_api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cluster-api:${{ github.sha }}

      - name: Update manifest image tag
        run: |
          sed -i "s|image: ghcr.io/bachelorprojectsw/cluster-api:.*|image: ghcr.io/bachelorprojectsw/cluster-api:${GITHUB_SHA}|" src/cluster_api/manifest/deployment.yaml

      - name: Commit manifest update
        run: |
          git config user.name "cluster-api-deploy-bot[bot]"
          git config user.email "cluster-api-deploy-bot[bot]@users.noreply.github.com"
          git add src/cluster_api/manifest/deployment.yaml
          git commit -m "Deploy cluster-api ${GITHUB_SHA}" || exit 0
          git push

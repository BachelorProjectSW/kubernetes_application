name: Build and push Docker image

on:
  push:
    branches:
      - GHCR-pushs

permissions:
  contents: read #Allow reading repository contents
  packages: write #Allow pushing container images to GHCR

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Set owner name to lowercase
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -f Dockerfile -t ghcr.io/${{ env.OWNER_LC }}/cluster-api:latest .

      - name: Push image
        run: |
          docker push ghcr.io/${{ env.OWNER_LC }}/cluster-api:latest